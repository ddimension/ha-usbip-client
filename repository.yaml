# repository.yaml

name: "HA USB/IP Client"
url: "https://github.com/ddimension/ha-usbip-client"
maintainer: "a.valentin@ddimension.net"
description: >
  A Home Assistant add-on to act as a USB/IP client, enabling remote USB devices 
  from a USB/IP server to be accessed in Home Assistant. This add-on supports high availability 
  configurations and device discovery.
version: "0.1.3"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
category: "Remote Access & Device Management"
logo: "https://github.com/ddimension/ha-usbip-client/blob/main/icon.png"
documentation: "https://github.com/ddimension/ha-usbip-client/blob/main/README.md"
license: "MIT"
